name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository-checks:
    name: Repository Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check trailing whitespace
        run: |
          if git grep -nI '[[:blank:]]$' -- .; then
            echo "Trailing whitespace found."
            exit 1
          fi
      - name: Run repository checks
        run: make check
      - name: Reproduce public artifacts
        run: make reproduce

  latex:
    name: Build LaTeX Manuscript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Reproduce public artifacts
        run: make reproduce
      - name: Build preprint manuscript and design preview
        uses: xu-cheng/latex-action@v4
        with:
          root_file: |
            main.tex
            paper/preprint-preview.tex
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error
          texlive_version: 2026
          post_compile: |
            python3 tools/scripts/check_latex_log.py build/main.log build/preprint-preview.log
            make subfile SUBFILE=paper/sections/10_introduction.tex
            make readme-previews README_PREVIEW_DIR=build/readme-assets
      - name: Upload preprint PDFs
        uses: actions/upload-artifact@v7
        with:
          name: preprint-pdfs
          path: |
            build/main.pdf
            build/preprint-preview.pdf
          if-no-files-found: error

  arxiv:
    name: Validate arXiv Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Reproduce public artifacts
        run: make reproduce
      - name: Smoke-test arXiv source packaging with TeX Live 2025
        uses: xu-cheng/texlive-action@v3
        with:
          texlive_version: 2025
          run: |
            set -e
            python3 -m unittest discover -s tools/tests
            make arxiv-check
